{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HomeoCompare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .auth-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .auth-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #999;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            margin: 0 16px;
        }

        .oauth-buttons {
            display: grid;
            gap: 12px;
        }

        .btn-oauth {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-oauth:hover {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
        }

        .btn-google {
            border-color: #db4437;
            color: #db4437;
        }

        .btn-google:hover {
            background: linear-gradient(135deg, rgba(219, 68, 55, 0.05), rgba(219, 68, 55, 0.05));
            border-color: #db4437;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
            display: block;
        }

        .alert-success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auth-footer {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 13px;
            color: #666;
        }

        .auth-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #666;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .code-input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .code-input {
            width: 50px;
            height: 50px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .code-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .verification-step {
            display: none;
        }

        .verification-step.active {
            display: block;
        }

        .login-step {
            display: none;
        }

        .login-step.active {
            display: block;
        }

        .code-timer {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 10px;
        }

        .resend-link {
            text-align: center;
            margin-top: 20px;
        }

        .resend-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .code-input {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Header -->
        <div class="auth-header">
            <h1><i class="fas fa-heartbeat"></i> HomeoCompare</h1>
            <p>Digital Homeopathic Case Paper System</p>
        </div>

        <!-- Body -->
        <div class="auth-body">
            <!-- Alert Messages -->
            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <!-- Step 1: Login Form -->
            <div id="loginStep" class="login-step active">
                <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                    {% csrf_token %}
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input 
                            type="email" 
                            class="form-input" 
                            id="emailInput" 
                            placeholder="Enter your email"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <button type="submit" class="btn-primary" id="loginBtn">
                        <span>Send Code</span>
                    </button>
                </form>

                <!-- Signup Link -->
                <div class="signup-link">
                    Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>
                </div>

                <div class="divider"><span>OR</span></div>

                <!-- OAuth Options -->
                <div class="oauth-buttons">
                    <a href="{% url 'google_login' %}" class="btn-oauth btn-google">
                        <i class="fab fa-google"></i> Continue with Google
                    </a>
                </div>
            </div>

            <!-- Step 2: Verification Code -->
            <div id="verificationStep" class="verification-step">
                <p style="text-align: center; margin-bottom: 20px; color: #666; font-size: 14px;">
                    Verification code sent to <strong id="displayEmail"></strong>
                </p>

                <form id="verificationForm" onsubmit="handleVerificationSubmit(event)">
                    {% csrf_token %}
                    <div class="form-group">
                        <label class="form-label">Enter 6-digit Code</label>
                        <div class="code-input-wrapper" id="codeInputWrapper">
                            <input type="text" class="code-input" maxlength="1" autocomplete="off">
                            <input type="text" class="code-input" maxlength="1" autocomplete="off">
                            <input type="text" class="code-input" maxlength="1" autocomplete="off">
                            <input type="text" class="code-input" maxlength="1" autocomplete="off">
                            <input type="text" class="code-input" maxlength="1" autocomplete="off">
                            <input type="text" class="code-input" maxlength="1" autocomplete="off">
                        </div>
                    </div>
                    <div class="code-timer" id="codeTimer"></div>
                    <button type="submit" class="btn-primary" id="verifyBtn">
                        <span>Verify & Continue</span>
                    </button>
                </form>

                <div class="back-link">
                    <a onclick="handleBackToLogin()">← Back to Login</a>
                </div>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <p>By logging in, you agree to our <a href="/privacy/">Privacy Policy</a></p>
            </div>
        </div>
    </div>

    <script>
        let currentUserId = null;
        let codeTimer = null;

        // Code Input Handler - Auto-focus next input
        document.querySelectorAll('.code-input').forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && index < 5) {
                    document.querySelectorAll('.code-input')[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    document.querySelectorAll('.code-input')[index - 1].focus();
                }
            });
        });

        function showAlert(message, type = 'error') {
            const alertEl = document.getElementById(`${type}Alert`);
            alertEl.textContent = message;
            alertEl.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    alertEl.style.display = 'none';
                }, 2000);
            }
        }

        function handleLoginSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const btn = document.getElementById('loginBtn');
            
            if (!email) {
                showAlert('Please enter your email', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Sending code...';

            fetch('{% url "login" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ email: email })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    currentUserId = data.user_id;
                    document.getElementById('displayEmail').textContent = data.email;
                    document.getElementById('loginStep').classList.remove('active');
                    document.getElementById('verificationStep').classList.add('active');
                    showAlert('Code sent to your email!', 'success');
                    startCodeTimer();
                } else {
                    showAlert(data.message || 'Failed to send code. Please try again.', 'error');
                }
            })
            .catch(error => {
                showAlert('An error occurred. Please try again.', 'error');
                console.error('Error:', error);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<span>Send Code</span>';
            });
        }

        function handleVerificationSubmit(event) {
            event.preventDefault();
            const codeInputs = document.querySelectorAll('.code-input');
            const code = Array.from(codeInputs).map(input => input.value).join('');
            const btn = document.getElementById('verifyBtn');

            if (code.length !== 6) {
                showAlert('Please enter all 6 digits', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Verifying...';

            fetch('{% url "verify_code" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ user_id: currentUserId, code: code })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    showAlert('Verified! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect_url || '/case_paper/';
                    }, 500);
                } else {
                    showAlert(data.message || 'Verification failed. Please try again.', 'error');
                }
            })
            .catch(error => {
                showAlert('An error occurred. Please try again.', 'error');
                console.error('Error:', error);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<span>Verify & Continue</span>';
            });
        }

        function handleBackToLogin() {
            document.getElementById('verificationStep').classList.remove('active');
            document.getElementById('loginStep').classList.add('active');
            document.querySelectorAll('.code-input').forEach(input => input.value = '');
            if (codeTimer) clearInterval(codeTimer);
        }

        function startCodeTimer() {
            let timeLeft = 600; // 10 minutes
            const timerEl = document.getElementById('codeTimer');
            
            if (codeTimer) clearInterval(codeTimer);
            
            codeTimer = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerEl.textContent = `Code expires in ${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(codeTimer);
                    timerEl.textContent = 'Code Expired - Go Back';
                }
            }, 1000);
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
