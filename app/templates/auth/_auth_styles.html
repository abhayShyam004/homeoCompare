<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --auth-bg: #f5f5f4;
        --auth-bg-soft: #fafaf9;
        --auth-card: rgba(255, 255, 255, 0.9);
        --auth-card-strong: #ffffff;
        --auth-border: rgba(45, 90, 39, 0.12);
        --auth-border-strong: rgba(45, 90, 39, 0.22);
        --auth-text: #111827;
        --auth-text-soft: #5b6473;
        --auth-accent: #2d5a27;
        --auth-accent-soft: #3f7c37;
        --auth-danger-bg: #fef2f2;
        --auth-danger-text: #b91c1c;
        --auth-danger-border: #fecaca;
        --auth-success-bg: #f0fdf4;
        --auth-success-text: #166534;
        --auth-success-border: #bbf7d0;
        --auth-shadow: 0 28px 70px rgba(15, 23, 42, 0.14);
    }

    .serif {
        font-family: "Cormorant Garamond", Georgia, serif;
    }

    .mono {
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    }

    body {
        font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--auth-text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 32px 20px;
        background:
            radial-gradient(circle at top left, rgba(45, 90, 39, 0.12), transparent 34%),
            radial-gradient(circle at bottom right, rgba(45, 90, 39, 0.08), transparent 30%),
            linear-gradient(135deg, #f7f7f5 0%, #eef3ea 100%);
        overflow-x: hidden;
    }

    body.auth-preload {
        overflow: hidden;
    }

    body.auth-preload .auth-container {
        filter: blur(3px);
        transform: scale(1.015);
    }

    .auth-intro {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
            radial-gradient(circle at 22% 18%, rgba(133, 192, 109, 0.26), transparent 24%),
            radial-gradient(circle at 80% 82%, rgba(255, 255, 255, 0.14), transparent 28%),
            linear-gradient(145deg, #132912 0%, #1f4420 45%, #0f2210 100%);
        transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    .auth-intro::before {
        content: "";
        position: absolute;
        inset: -10%;
        background:
            conic-gradient(from 90deg at 50% 50%, rgba(255, 255, 255, 0.04), transparent 36%, rgba(255, 255, 255, 0.08), transparent 68%, rgba(255, 255, 255, 0.04));
        animation: authSpin 8s linear infinite;
    }

    .auth-intro-core {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 18px;
        place-items: center;
        text-align: center;
        color: #f8fafc;
        animation: authReveal 1.2s cubic-bezier(0.17, 0.89, 0.32, 1.07);
    }

    .auth-intro-mark {
        width: 74px;
        height: 74px;
        object-fit: contain;
        filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.35));
    }

    .auth-intro-line {
        font-size: 11px;
        letter-spacing: 0.2em;
        opacity: 0.78;
    }

    .auth-intro h1 {
        font-size: clamp(2rem, 4.5vw, 3.25rem);
        letter-spacing: -0.03em;
        line-height: 1;
    }

    .auth-intro.is-hidden {
        opacity: 0;
        visibility: hidden;
    }

    .auth-container {
        width: min(100%, 1040px);
        min-height: min(760px, calc(100vh - 64px));
        display: grid;
        grid-template-columns: minmax(280px, 0.92fr) minmax(340px, 1.08fr);
        background: var(--auth-card);
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: var(--auth-shadow);
        backdrop-filter: blur(18px);
    }

    .auth-header {
        position: relative;
        padding: 44px 38px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 26px;
        color: #f8fafc;
        background:
            linear-gradient(180deg, rgba(8, 15, 12, 0.06), rgba(8, 15, 12, 0.16)),
            linear-gradient(145deg, #23451f 0%, #2d5a27 48%, #17361b 100%);
    }

    .auth-header::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.16), transparent 18%),
            radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1), transparent 24%);
        pointer-events: none;
    }

    .auth-header > * {
        position: relative;
        z-index: 1;
    }

    .auth-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
    }

    .auth-brand-mark {
        width: 38px;
        height: 38px;
        object-fit: contain;
        display: block;
    }

    .auth-header-copy h1 {
        font-size: clamp(2rem, 4vw, 3.1rem);
        line-height: 1;
        margin-bottom: 14px;
        letter-spacing: -0.04em;
    }

    .auth-header-copy p {
        font-size: 15px;
        line-height: 1.7;
        color: rgba(248, 250, 252, 0.82);
        max-width: 30ch;
    }

    .auth-feature-list {
        list-style: none;
        display: grid;
        gap: 14px;
    }

    .auth-feature-list li {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: rgba(248, 250, 252, 0.9);
    }

    .auth-feature-list i {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.12);
    }

    .auth-body {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(250, 250, 249, 0.98));
        padding: 42px 40px 34px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .auth-panel-top {
        margin-bottom: 28px;
    }

    .auth-kicker {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(45, 90, 39, 0.08);
        color: var(--auth-accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 14px;
    }

    .auth-panel-top h2 {
        font-size: clamp(1.75rem, 2vw, 2.2rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
        margin-bottom: 10px;
    }

    .auth-panel-top p {
        color: var(--auth-text-soft);
        font-size: 14px;
        line-height: 1.65;
        max-width: 42ch;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--auth-text);
        margin-bottom: 8px;
    }

    .form-input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--auth-border);
        background: var(--auth-card-strong);
        border-radius: 14px;
        font-size: 14px;
        color: var(--auth-text);
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .form-input::placeholder {
        color: #94a3b8;
    }

    .form-input:focus {
        outline: none;
        border-color: var(--auth-border-strong);
        box-shadow: 0 0 0 4px rgba(45, 90, 39, 0.08);
        transform: translateY(-1px);
    }

    .btn-primary,
    .btn-oauth {
        width: 100%;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
        text-decoration: none;
    }

    .btn-primary {
        margin-top: 18px;
        padding: 14px 18px;
        border: 1px solid var(--auth-accent);
        background: linear-gradient(135deg, #2d5a27 0%, #3a6d31 100%);
        color: #f8fafc;
        box-shadow: 0 12px 28px rgba(45, 90, 39, 0.18);
    }

    .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 32px rgba(45, 90, 39, 0.22);
    }

    .btn-primary:active {
        transform: translateY(0);
    }

    .btn-primary:disabled {
        opacity: 0.72;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 24px 0;
        color: #94a3b8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(148, 163, 184, 0.24);
    }

    .oauth-buttons {
        display: grid;
        gap: 12px;
    }

    .btn-oauth {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 13px 16px;
        border: 1px solid var(--auth-border);
        background: rgba(255, 255, 255, 0.92);
        color: var(--auth-text);
    }

    .btn-oauth:hover {
        transform: translateY(-1px);
        border-color: var(--auth-border-strong);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
    }

    .btn-google {
        color: #1f2937;
    }

    .alert {
        padding: 13px 15px;
        border-radius: 14px;
        margin-bottom: 18px;
        font-size: 14px;
        display: none;
    }

    .alert-error {
        background-color: var(--auth-danger-bg);
        color: var(--auth-danger-text);
        border: 1px solid var(--auth-danger-border);
        display: block;
    }

    .alert-success {
        background-color: var(--auth-success-bg);
        color: var(--auth-success-text);
        border: 1px solid var(--auth-success-border);
        display: block;
    }

    .auth-footer,
    .signup-link,
    .login-link,
    .back-link,
    .resend-link,
    .code-timer {
        text-align: center;
        font-size: 13px;
        color: var(--auth-text-soft);
    }

    .auth-footer {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid rgba(148, 163, 184, 0.16);
    }

    .signup-link,
    .login-link,
    .back-link,
    .resend-link {
        margin-top: 16px;
    }

    .auth-footer a,
    .signup-link a,
    .login-link a,
    .back-link a,
    .resend-link a {
        color: var(--auth-accent);
        text-decoration: none;
        font-weight: 700;
    }

    .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top: 2px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    .code-input-wrapper {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
        justify-content: center;
    }

    .code-input {
        width: 52px;
        height: 56px;
        font-size: 22px;
        text-align: center;
        border: 1px solid var(--auth-border);
        border-radius: 14px;
        font-weight: 700;
        background: var(--auth-card-strong);
        color: var(--auth-text);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .code-input:focus {
        outline: none;
        border-color: var(--auth-border-strong);
        box-shadow: 0 0 0 4px rgba(45, 90, 39, 0.08);
    }

    .verification-step,
    .login-step {
        display: none;
    }

    .verification-step.active,
    .login-step.active {
        display: block;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes authSpin {
        0% { transform: rotate(0deg) scale(1); }
        100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes authReveal {
        0% {
            transform: translateY(20px) scale(0.96);
            opacity: 0;
        }
        60% {
            transform: translateY(0) scale(1.02);
            opacity: 1;
        }
        100% {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
    }

    @media (max-width: 900px) {
        .auth-container {
            grid-template-columns: 1fr;
            width: min(100%, 620px);
        }

        .auth-header {
            padding: 34px 28px;
        }

        .auth-header-copy p {
            max-width: none;
        }
    }

    @media (max-width: 560px) {
        body {
            padding: 14px;
        }

        .auth-container {
            min-height: auto;
            border-radius: 22px;
        }

        .auth-header,
        .auth-body {
            padding: 28px 20px;
        }

        .auth-brand {
            font-size: 24px;
        }

        .auth-feature-list {
            gap: 10px;
        }

        .code-input {
            width: 44px;
            height: 50px;
            font-size: 20px;
        }

        .auth-intro-mark {
            width: 62px;
            height: 62px;
        }

        .auth-intro-line {
            font-size: 9px;
            letter-spacing: 0.16em;
        }
    }
</style>
