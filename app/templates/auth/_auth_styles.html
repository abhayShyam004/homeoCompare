<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --auth-bg: #f8fafc;
        --auth-bg-soft: #ffffff;
        --auth-card: rgba(255, 255, 255, 0.95);
        --auth-card-strong: #ffffff;
        --auth-border: rgba(15, 23, 42, 0.08);
        --auth-border-strong: rgba(15, 23, 42, 0.14);
        --auth-text: #0f172a;
        --auth-text-soft: #475569;
        --auth-accent: #1e3a1a;
        --auth-accent-soft: #2d5a27;
        --auth-accent-light: rgba(45, 90, 39, 0.08);
        --auth-danger-bg: #fff1f2;
        --auth-danger-text: #9f1239;
        --auth-danger-border: #fecdd3;
        --auth-success-bg: #f0fdf4;
        --auth-success-text: #166534;
        --auth-success-border: #bbf7d0;
        --auth-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.12);
        --auth-radius: 18px;
        --auth-gradient-body: linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(250, 250, 249, 0.98));
        --auth-input-bg: #ffffff;
        --auth-oauth-bg: rgba(255, 255, 255, 0.92);
        --auth-divider: rgba(148, 163, 184, 0.24);
        --auth-brand-bg: #1e3a1a;
    }

    [data-theme="dark"] {
        --auth-bg: #0f172a;
        --auth-bg-soft: #1e293b;
        --auth-card: rgba(30, 41, 59, 0.95);
        --auth-card-strong: #1e293b;
        --auth-border: rgba(255, 255, 255, 0.1);
        --auth-border-strong: rgba(255, 255, 255, 0.2);
        --auth-text: #f1f5f9;
        --auth-text-soft: #94a3b8;
        --auth-accent: #22c55e;
        --auth-accent-soft: #16a34a;
        --auth-accent-light: rgba(34, 197, 94, 0.15);
        --auth-danger-bg: #4c1d95;
        --auth-danger-text: #fecdd3;
        --auth-danger-border: #9f1239;
        --auth-success-bg: #064e3b;
        --auth-success-text: #bbf7d0;
        --auth-success-border: #166534;
        --auth-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
        --auth-gradient-body: linear-gradient(180deg, rgba(30, 41, 59, 0.97), rgba(15, 23, 42, 0.98));
        --auth-input-bg: #0f172a;
        --auth-oauth-bg: rgba(30, 41, 59, 0.92);
        --auth-divider: rgba(255, 255, 255, 0.15);
        --auth-brand-bg: #22c55e;
    }

    .serif {
        font-family: "Cormorant Garamond", Georgia, serif;
    }

    .mono {
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    }

    body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--auth-text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background-color: var(--auth-bg);
        background-image: 
            radial-gradient(at 0% 0%, rgba(30, 58, 26, 0.05) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(30, 58, 26, 0.03) 0px, transparent 50%);
        overflow-x: hidden;
    }

    body.auth-preload {
        overflow: hidden;
    }

    body.auth-preload .auth-container {
        filter: blur(3px);
        transform: scale(1.015);
    }

    .auth-intro {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
            radial-gradient(circle at 22% 18%, rgba(133, 192, 109, 0.26), transparent 24%),
            radial-gradient(circle at 80% 82%, rgba(255, 255, 255, 0.14), transparent 28%),
            linear-gradient(145deg, #132912 0%, #1f4420 45%, #0f2210 100%);
        transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    .auth-intro::before {
        content: "";
        position: absolute;
        inset: -10%;
        background:
            conic-gradient(from 90deg at 50% 50%, rgba(255, 255, 255, 0.04), transparent 36%, rgba(255, 255, 255, 0.08), transparent 68%, rgba(255, 255, 255, 0.04));
        animation: authSpin 8s linear infinite;
    }

    .auth-intro-core {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 18px;
        place-items: center;
        text-align: center;
        color: #f8fafc;
        animation: authReveal 1.2s cubic-bezier(0.17, 0.89, 0.32, 1.07);
    }

    .auth-intro-mark {
        width: 74px;
        height: 74px;
        object-fit: contain;
        filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.35));
    }

    .auth-intro-line {
        font-size: 11px;
        letter-spacing: 0.2em;
        opacity: 0.78;
    }

    .auth-intro h1 {
        font-size: clamp(2rem, 4.5vw, 3.25rem);
        letter-spacing: -0.03em;
        line-height: 1;
    }

    .auth-intro.is-hidden {
        opacity: 0;
        visibility: hidden;
    }

    .auth-container {
        width: min(100%, 1000px);
        min-height: 640px;
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        background: var(--auth-card);
        border: 1px solid var(--auth-border);
        border-radius: var(--auth-radius);
        overflow: hidden;
        box-shadow: var(--auth-shadow);
        backdrop-filter: blur(12px);
    }

    .auth-header {
        position: relative;
        padding: 60px 50px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 32px;
        color: #ffffff;
        background: var(--auth-brand-bg);
        background-image: 
            linear-gradient(145deg, #1e3a1a 0%, #162d14 100%);
    }

    .auth-header::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 86c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zm66-3c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zm-40-39c.553 0 1-.447 1-1s-.447-1-1-1-1 .447-1 1 .447 1 1 1zm50 38c.553 0 1-.447 1-1s-.447-1-1-1-1 .447-1 1 .447 1 1 1zM40 5c.553 0 1-.447 1-1s-.447-1-1-1-1 .447-1 1 .447 1 1 1zM6 45c.553 0 1-.447 1-1s-.447-1-1-1-1 .447-1 1 .447 1 1 1z' fill='%23ffffff' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
        pointer-events: none;
    }

    .auth-header > * {
        position: relative;
        z-index: 1;
    }

    .auth-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
    }

    .auth-brand-mark {
        width: 38px;
        height: 38px;
        object-fit: contain;
        display: block;
    }

    .auth-header-copy h1 {
        font-size: clamp(2rem, 4vw, 3.1rem);
        line-height: 1;
        margin-bottom: 14px;
        letter-spacing: -0.04em;
    }

    .auth-header-copy p {
        font-size: 15px;
        line-height: 1.7;
        color: rgba(248, 250, 252, 0.82);
        max-width: 30ch;
    }

    .auth-feature-list {
        list-style: none;
        display: grid;
        gap: 14px;
    }

    .auth-feature-list li {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: rgba(248, 250, 252, 0.9);
    }

    .auth-feature-list i {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.12);
    }

    .auth-body {
        background: var(--auth-gradient-body);
        padding: 42px 40px 34px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .auth-panel-top {
        margin-bottom: 28px;
    }

    .auth-kicker {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--auth-accent-light);
        color: var(--auth-accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 14px;
    }

    .auth-panel-top h2 {
        font-size: clamp(1.75rem, 2vw, 2.2rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
        margin-bottom: 10px;
    }

    .auth-panel-top p {
        color: var(--auth-text-soft);
        font-size: 14px;
        line-height: 1.65;
        max-width: 42ch;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--auth-text);
        margin-bottom: 8px;
    }

    .form-input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--auth-border);
        background: var(--auth-bg-soft);
        border-radius: 12px;
        font-size: 15px;
        color: var(--auth-text);
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-input:focus {
        outline: none;
        border-color: var(--auth-accent-soft);
        background: var(--auth-input-bg);
        box-shadow: 0 0 0 4px rgba(30, 58, 26, 0.06);
    }

    .btn-primary {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-top: 20px;
        padding: 16px 20px;
        border: none;
        border-radius: 14px;
        background: var(--auth-accent);
        color: #ffffff;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(30, 58, 26, 0.2);
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-primary:hover {
        background: var(--auth-accent-soft);
        transform: translateY(-1.5px);
        box-shadow: 0 8px 20px rgba(30, 58, 26, 0.25);
    }

    .btn-primary:active {
        transform: translateY(0);
    }

    .btn-primary:disabled {
        opacity: 0.72;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 24px 0;
        color: #94a3b8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--auth-divider);
    }

    .oauth-buttons {
        display: grid;
        gap: 12px;
    }

    .btn-oauth {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 13px 16px;
        border: 1px solid var(--auth-border);
        background: var(--auth-oauth-bg);
        color: var(--auth-text);
        text-decoration: none;
    }

    .btn-oauth:focus,
    .btn-oauth:hover,
    .btn-oauth:active {
        text-decoration: none;
    }

    .btn-oauth:hover {
        transform: translateY(-1px);
        border-color: var(--auth-border-strong);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
    }

    .btn-google {
        /* Use theme-aware text color so the button remains visible in dark mode */
        color: var(--auth-text);
    }

    .btn-google i {
        /* Ensure the Google icon follows the text color unless a brand color is desired */
        color: inherit;
    }

    .alert {
        padding: 13px 15px;
        border-radius: 14px;
        margin-bottom: 18px;
        font-size: 14px;
        display: none;
    }

    .alert-error {
        background-color: var(--auth-danger-bg);
        color: var(--auth-danger-text);
        border: 1px solid var(--auth-danger-border);
    }

    .alert-success {
        background-color: var(--auth-success-bg);
        color: var(--auth-success-text);
        border: 1px solid var(--auth-success-border);
    }

    .auth-footer,
    .signup-link,
    .login-link,
    .back-link,
    .resend-link,
    .code-timer {
        text-align: center;
        font-size: 13px;
        color: var(--auth-text-soft);
    }

    .auth-footer {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid rgba(148, 163, 184, 0.16);
    }

    .signup-link,
    .login-link,
    .back-link,
    .resend-link {
        margin-top: 16px;
    }

    .auth-footer a,
    .signup-link a,
    .login-link a,
    .back-link a,
    .resend-link a {
        color: var(--auth-accent);
        text-decoration: none;
        font-weight: 700;
    }

    /* Floating Theme Toggle */
    .theme-toggle {
        position: fixed;
        bottom: 24px;
        left: 24px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
        border: none;
        padding: 0;
    }

    .theme-toggle:hover {
        transform: translateY(-3px) scale(1.05);
    }
    
    .theme-toggle i {
        position: absolute;
        font-size: 1.3rem;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Default (Light Mode in Auth) */
    .theme-toggle {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .theme-toggle:hover {
        box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.15);
    }
    .theme-toggle .sun-icon {
        transform: translateY(0) rotate(0);
        opacity: 1;
        color: #f59e0b;
    }
    .theme-toggle .moon-icon {
        transform: translateY(30px) rotate(90deg);
        opacity: 0;
        color: #3b82f6;
    }

    /* Dark Mode Overrides */
    [data-theme="dark"] .theme-toggle {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    [data-theme="dark"] .theme-toggle:hover {
        box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
    }
    [data-theme="dark"] .theme-toggle .sun-icon {
        transform: translateY(-30px) rotate(-90deg);
        opacity: 0;
    }
    [data-theme="dark"] .theme-toggle .moon-icon {
        transform: translateY(0) rotate(0);
        opacity: 1;
        color: #f1f5f9;
    }

    .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top: 2px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    .code-input-wrapper {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
        justify-content: center;
    }

    .code-input {
        width: 54px;
        height: 64px;
        font-size: 24px;
        text-align: center;
        border: 1px solid var(--auth-border);
        border-radius: 12px;
        font-weight: 600;
        background: var(--auth-bg-soft);
        color: var(--auth-text);
        transition: all 0.2s ease;
    }

    .code-input:focus {
        outline: none;
        border-color: var(--auth-accent-soft);
        background: var(--auth-input-bg);
        box-shadow: 0 0 0 4px rgba(30, 58, 26, 0.06);
        transform: scale(1.05);
    }

    .verification-step,
    .login-step {
        display: none;
    }

    .verification-step.active,
    .login-step.active {
        display: block;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes authSpin {
        0% { transform: rotate(0deg) scale(1); }
        100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes authReveal {
        0% {
            transform: translateY(20px) scale(0.96);
            opacity: 0;
        }
        60% {
            transform: translateY(0) scale(1.02);
            opacity: 1;
        }
        100% {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
    }

    @media (max-width: 900px) {
        .auth-container {
            grid-template-columns: 1fr;
            width: min(100%, 620px);
        }

        .auth-header {
            padding: 34px 28px;
        }

        .auth-header-copy p {
            max-width: none;
        }
    }

    @media (max-width: 560px) {
        body {
            padding: 14px;
        }

        .auth-container {
            min-height: auto;
            border-radius: 22px;
        }

        .auth-header,
        .auth-body {
            padding: 28px 20px;
        }

        .auth-brand {
            font-size: 24px;
        }

        .auth-feature-list {
            gap: 10px;
        }

        .code-input {
            width: 44px;
            height: 50px;
            font-size: 20px;
        }

        .auth-intro-mark {
            width: 62px;
            height: 62px;
        }

        .auth-intro-line {
            font-size: 9px;
            letter-spacing: 0.16em;
        }
    }
</style>
