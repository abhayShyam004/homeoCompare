<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email Code - HomeoCompare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .code-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .code-input {
            width: 50px;
            height: 50px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-weight: bold;
            color: #667eea;
            transition: all 0.3s;
        }

        .code-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .code-input.filled {
            background-color: #f0f0f0;
            border-color: #667eea;
        }

        .timer {
            text-align: center;
            font-size: 12px;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .timer.warning {
            color: #e67e22;
            font-weight: bold;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-verify {
            background-color: #667eea;
            color: white;
        }

        .btn-verify:hover:not(:disabled) {
            background-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-verify:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-back {
            background-color: #e8eef7;
            color: #667eea;
        }

        .btn-back:hover {
            background-color: #d8dff0;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background-color: #fadbd8;
            color: #c0392b;
            border-left: 4px solid #e74c3c;
        }

        .message.success {
            background-color: #d5f4e6;
            color: #27ae60;
            border-left: 4px solid #2ecc71;
        }

        .message.show {
            display: block;
        }

        .resend-link {
            text-align: center;
            margin-top: 12px;
            font-size: 12px;
        }

        .resend-link a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .resend-link a:hover {
            text-decoration: underline;
        }

        .resend-link.disabled a {
            color: #999;
            cursor: not-allowed;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px;
            }

            .code-inputs {
                gap: 6px;
            }

            .code-input {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }

        .loading {
            display: none;
            text-align: center;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Verify Your Email</h1>
            <p>Enter the 6-digit code sent to {{ email }}</p>
        </div>

        <div class="message" id="message"></div>

        <form id="verificationForm">
            {% csrf_token %}
            <input type="hidden" id="user_id" value="{{ user_id }}">

            <div class="form-group">
                <div class="code-inputs">
                    <input type="text" class="code-input" id="code1" maxlength="1" inputmode="numeric">
                    <input type="text" class="code-input" id="code2" maxlength="1" inputmode="numeric">
                    <input type="text" class="code-input" id="code3" maxlength="1" inputmode="numeric">
                    <input type="text" class="code-input" id="code4" maxlength="1" inputmode="numeric">
                    <input type="text" class="code-input" id="code5" maxlength="1" inputmode="numeric">
                    <input type="text" class="code-input" id="code6" maxlength="1" inputmode="numeric">
                </div>

                <div class="timer" id="timer">
                    Code expires in: <span id="timerValue">10:00</span>
                </div>
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-back" onclick="goBack()">← Back</button>
                <button type="submit" class="btn btn-verify" id="verifyBtn">Verify & Continue</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #666; font-size: 14px;">Verifying...</p>
            </div>

            <div class="resend-link" id="resendLink">
                Didn't receive the code? <a href="{% url 'login' %}">Request a new code</a>
            </div>
        </form>
    </div>

    <script>
        const codeInputs = document.querySelectorAll('.code-input');
        const verificationForm = document.getElementById('verificationForm');
        const messageEl = document.getElementById('message');
        const loadingEl = document.getElementById('loading');
        const userId = document.getElementById('user_id').value;
        let timerInterval;

        // Auto-focus and move between inputs
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < codeInputs.length - 1) {
                    codeInputs[index + 1].focus();
                }
                e.target.classList.toggle('filled', e.target.value !== '');
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });

            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });

        // Timer
        function startTimer() {
            let timeLeft = 600; // 10 minutes in seconds

            const updateTimer = () => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                const formattedTime = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                document.getElementById('timerValue').textContent = formattedTime;

                const timerEl = document.getElementById('timer');
                if (timeLeft < 60) {
                    timerEl.classList.add('warning');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showMessage('Verification code has expired. Please request a new one.', 'error');
                    document.getElementById('verifyBtn').disabled = true;
                    codeInputs.forEach(input => input.disabled = true);
                }

                timeLeft--;
            };

            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }

        startTimer();

        // Handle verification
        verificationForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const code = Array.from(codeInputs).map(input => input.value).join('');

            if (code.length !== 6) {
                showMessage('Please enter all 6 digits', 'error');
                return;
            }

            loadingEl.classList.add('show');
            document.getElementById('verifyBtn').disabled = true;

            try {
                const response = await fetch('{% url "verify_code" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        code: code
                    })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    showMessage(data.message, 'success');
                    clearInterval(timerInterval);
                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 1500);
                } else {
                    showMessage(data.message, 'error');
                    loadingEl.classList.remove('show');
                    document.getElementById('verifyBtn').disabled = false;
                    // Clear the code inputs on error
                    codeInputs.forEach(input => input.value = '');
                    codeInputs[0].focus();
                }
            } catch (error) {
                showMessage('An error occurred. Please try again.', 'error');
                loadingEl.classList.remove('show');
                document.getElementById('verifyBtn').disabled = false;
            }
        });

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = `message ${type} show`;
            setTimeout(() => {
                if (type === 'error') {
                    messageEl.classList.remove('show');
                }
            }, 5000);
        }

        function goBack() {
            window.location.href = '{% url "signup" %}';
        }

        // Auto-submit when all 6 digits are entered
        const observeFullCode = () => {
            const allFilled = Array.from(codeInputs).every(input => input.value !== '');
            if (allFilled) {
                // Optional: auto-submit after a brief delay for UX
                setTimeout(() => {
                    verificationForm.dispatchEvent(new Event('submit'));
                }, 300);
            }
        };

        codeInputs.forEach(input => {
            input.addEventListener('input', observeFullCode);
        });
    </script>
</body>
</html>
