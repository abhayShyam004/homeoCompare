<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Feedback – HomeoCompare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'favicon_v4.ico' %}">
    <style>
        :root {
            /* Slate Theme Variables */
            --primary: #059669;
            --primary-dark: #047857;
            --primary-light: #10b981;
            --secondary: #0891b2;
            
            --bg-dark: #0f172a;
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --bg-hover: #334155;
            
            --text-white: #ffffff;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --border: #334155;
            --border-light: #475569;
            --radius: 8px;
            --radius-lg: 12px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --bg-hover: #e2e8f0;
            
            --text-white: #0f172a;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --border: #e2e8f0;
            --border-light: #cbd5e1;
            
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 0;
            margin-bottom: 0;
            box-shadow: none;
        }

        .header-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .home-button {
            text-decoration: none;
            background: var(--primary);
            color: white;
            width: 40px; 
            height: 40px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            transition: all 0.2s;
            border: none;
        }
        
        .home-button:hover { transform: translateY(-2px); }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
            text-align: center;
        }

        .page-title {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .page-title h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text-white), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .theme-toggle:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        form {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow);
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input[type="email"],
        textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            background-color: var(--bg-input);
            color: var(--text-primary);
            transition: all 0.2s;
            font-family: inherit;
        }

        input[type="email"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        button[type="submit"] {
            display: inline-block;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        button[type="submit"]:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            background: var(--bg-card);
            margin-top: auto;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .container { padding: 1.5rem 1rem; }
            form { padding: 1.5rem; }
            .toggle-text { display: none; }
        }
    </style>
</head>

    <header>
        <div class="header-content">
            <div class="header-left">
                <a href="/" class="home-button">Hc</a>
                <h1>Feedback</h1>
            </div>
            
            <button class="theme-toggle" id="themeToggle">
                <span class="toggle-text">Light Mode</span>
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <div class="page-title">
            <h2>Send Suggestions</h2>
            <p style="color:var(--text-secondary)">Help us improve HomeoCompare</p>
        </div>

        <form action="{% url 'submit_feedback' %}" method="POST">
            {% csrf_token %}
            <!-- Hidden inputs preserved for Formspree if proxied, but handled in view -->
            <input type="hidden" name="_next" value="{% url 'thanks' %}">
            <input type="hidden" name="_subject" value="New Suggestion from HomeoCompare users">

            <label for="email">Your email:</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com">

            <label for="message">Your suggestion:</label>
            <textarea id="message" name="message" rows="5" required placeholder="Tell us what you think..."></textarea>

            <button type="submit">Send Feedback</button>
        </form>
    </div>

    <footer>
        <p>© 2025 HomeoCompare. All rights reserved.</p>
    </footer>

    <script>
        const themeToggle = document.querySelector('.theme-toggle');
        const toggleText = themeToggle.querySelector('.toggle-text');
        const toggleIcon = themeToggle.querySelector('i');

        // Initial check is implicit in CSS defaults (root: dark)
        // If user wants to toggle:
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.documentElement.removeAttribute('data-theme'); // Go back to root (Dark)
                toggleText.textContent = 'Light Mode';
                toggleIcon.classList.remove('fa-sun');
                toggleIcon.classList.add('fa-moon');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                toggleText.textContent = 'Dark Mode';
                toggleIcon.classList.remove('fa-moon');
                toggleIcon.classList.add('fa-sun');
            }
        });
    </script>

</html>
