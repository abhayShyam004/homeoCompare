{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Saved Remedies | HomeoCompare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="{% static 'favicon_v4.ico' %}">
    
    <!-- Reuse existing styles -->
    <style>
        /* reusing variables from base.html */
        :root {
            --sidebar-width: 300px;
            --header-height: 85px;
            
            --primary: #059669;
            --primary-dark: #047857;
            --primary-light: #10b981;
            --secondary: #0891b2;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            
            --bg-dark: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --bg-hover: #334155;
            
            --text-white: #ffffff;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --border: #334155;
            --border-light: #475569;
            
            --radius: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.4);
        }

        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --bg-sidebar: #ffffff;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --bg-hover: #e2e8f0;
            
            --text-white: #0f172a;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --border: #e2e8f0;
            --border-light: #cbd5e1;
            
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            overflow: hidden;
        }

        /* Sidebar - Same as base.html */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0; z-index: 100;
        }
        .sidebar-header { padding: 1.25rem; border-bottom: 1px solid var(--border); }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon { width: 44px; height: 44px; background: var(--primary); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; }
        .logo-text h1 { font-size: 1rem; font-weight: 700; color: var(--text-white); }
        .logo-text span { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
        .sidebar-section { padding: 0.75rem 1.25rem; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
        .section-title { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
        .action-btn { display: flex; align-items: center; gap: 10px; padding: 0.7rem 0.75rem; background: transparent; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; text-decoration: none; margin-bottom: 6px; }
        .action-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .action-btn i { width: 18px; text-align: center; color: var(--text-muted); }
        .action-btn:hover i { color: var(--primary-light); }
        .sidebar-footer { padding: 1rem 1.25rem; border-top: 1px solid var(--border); }
        .theme-toggle { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-secondary); cursor: pointer; width: 100%; }

        /* Main Content */
        .main-wrapper { margin-left: var(--sidebar-width); flex: 1; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
        .topbar { height: 85px; min-height: 85px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; position: sticky; top: 0; z-index: 50; }
        .topbar-title { font-size: 1.35rem; font-weight: 700; color: var(--text-white); }
        .main-content { flex: 1; padding: 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }

        /* Saved Cards */
        .saved-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .saved-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; transition: all 0.2s; }
        .saved-card:hover { border-color: var(--border-light); box-shadow: var(--shadow); }
        .saved-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; }
        .saved-title h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-white); margin-bottom: 4px; }
        .saved-source { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .delete-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; transition: color 0.2s; }
        .delete-btn:hover { color: var(--danger); }
        
        .saved-body { padding: 1.25rem; }
        .note-area { width: 100%; min-height: 100px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; color: var(--text-primary); font-family: inherit; font-size: 0.9rem; resize: vertical; margin-top: 0.5rem; transition: border-color 0.2s; }
        .note-area:focus { outline: none; border-color: var(--primary); }
        .note-label { font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; display: block; margin-bottom: 4px; }
        
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }

        .saved-count-badge { background: var(--primary); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 100px; font-weight: 600; vertical-align: middle; margin-left: 6px;}

        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
            .sidebar.active { transform: translateX(0); }
            .main-wrapper { margin-left: 0; }
            .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; display: none; }
            .sidebar-overlay.active { display: block; }
            .mobile-menu-btn { display: block; background: transparent; border: 1px solid var(--border); color: var(--text-primary); width: 40px; height: 40px; border-radius: var(--radius); cursor: pointer; }
        }
        @media (min-width: 1025px) { .mobile-menu-btn { display: none; } }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="{% url 'home' %}" class="logo">
                <div class="logo-icon">Hc</div>
                <div class="logo-text">
                    <h1>HomeoCompare</h1>
                    <span>My Saved</span>
                </div>
            </a>
        </div>
        
        <div class="sidebar-content">
            <div class="sidebar-section">
                <div class="section-header"><span class="section-title">Navigation</span></div>
                <div class="quick-actions">
                     <a href="{% url 'home' %}" class="action-btn">
                        <i class="fas fa-home"></i> Back to Home
                    </a>
                    <a href="{% url 'boericke_comparison' %}" class="action-btn">
                        <i class="fas fa-balance-scale"></i> Boericke Search
                    </a>
                    <a href="{% url 'allen_comparison' %}" class="action-btn">
                         <i class="fas fa-book-medical"></i> Allen's Keynotes
                    </a>
                </div>
            </div>
            
            <div class="sidebar-section">
                <div class="section-header"><span class="section-title">My Collection</span></div>
                <div class="quick-actions">
                    <a href="#" class="action-btn" style="background: var(--bg-hover); color: var(--text-primary); border-color: var(--primary);">
                        <i class="fas fa-star" style="color: var(--warning);"></i>
                        Saved Remedies
                        <span class="count-badge saved-count-badge" style="display:none">0</span>
                    </a>
                </div>
            </div>
        </div>
        
        <div class="sidebar-footer">
            <button id="themeToggle" class="theme-toggle">
                <span><i class="fas fa-moon"></i> Dark Mode</span>
            </button>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
            <h2 class="topbar-title">My Saved Remedies</h2>
            <button class="mobile-menu-btn" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        </header>

        <main class="main-content">
            <div id="savedContainer" class="saved-grid">
                <!-- Content injected by JS -->
            </div>
        </main>
    </div>

    <script src="{% static 'js/bookmarks.js' %}"></script>
    <script>
        // Init logic
        document.addEventListener('DOMContentLoaded', () => {
            renderSavedPage();
            
            // Theme toggle logic duplication (simplification)
const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeToggle').onclick = () => {
                const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            };
            
            // Mobile sidebar
            const toggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if(toggle) {
                toggle.onclick = () => {
                    sidebar.classList.toggle('active');
                    overlay.classList.toggle('active');
                };
                overlay.onclick = () => {
                    sidebar.classList.remove('active');
                    overlay.classList.remove('active');
                };
            }
        });

        function renderSavedPage() {
            const container = document.getElementById('savedContainer');
            const data = BookmarksManager.getAll();
            const items = Object.values(data).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-icon"><i class="far fa-star"></i></div>
                        <h3>No saved remedies yet</h3>
                        <p>Star remedies while comparing to save them here.</p>
                        <br>
                        <a href="{% url 'boericke_comparison' %}" class="action-btn" style="display:inline-flex;">Start Exploring</a>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = items.map(item => `
                <div class="saved-card">
                    <div class="saved-header">
                        <div class="saved-title">
                            <h3>${item.displayName || item.name}</h3>
                            <span class="saved-source">${item.source === 'allen' ? "Allen's Keynotes" : "Boericke's Materia Medica"}</span>
                        </div>
                        <button class="delete-btn" title="Remove" onclick="removeSaved('${item.name}', '${item.source}')">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                    <div class="saved-body">
                        <label class="note-label">My Notes</label>
                        <textarea class="note-area" placeholder="Add a personal note..." 
                            onblur="saveNote(this, '${item.name}', '${item.source}')">${item.note || ''}</textarea>
                    </div>
                </div>
            `).join('');
            
            BookmarksManager.updateUI();
        }

        function removeSaved(name, source) {
            if(confirm('Remove this remedy from your saved list?')) {
                BookmarksManager.toggle(name, source, name);
                renderSavedPage();
            }
        }

        function saveNote(textarea, name, source) {
            BookmarksManager.saveNote(name, source, textarea.value);
        }
    </script>
</body>
</html>
