{% extends 'case_paper/base.html' %}

{% block page_title_header %}{{ page_title|default:"New Case Paper" }}{% endblock %}

{% block main_content %}
<form id="casePaperForm" method="post" class="space-y-8" action="{% if case.case_id %}{% url 'case_paper_edit' case.case_id %}{% else %}{% url 'case_paper_new' %}{% endif %}">
    {% csrf_token %}

    <!-- Section 1: Patient Profile -->
    <div class="bg-paper border-2 border-ink p-6">
        <div class="flex items-center justify-between border-b-2 border-ink pb-3 mb-6">
            <h2 class="font-serif text-2xl font-bold">1. Patient Profile</h2>
        </div>
        <div class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div>
                    <label class="font-mono text-xs font-bold uppercase tracking-wider text-ink/70 mb-1 block" for="id_physician_name">Physician Name *</label>
                    <input type="text" name="physician_name" id="id_physician_name" class="w-full bg-paper border-2 border-ink py-2 px-3 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-accent transition-all" value="{% if case.preliminary.physician_name %}{{ case.preliminary.physician_name }}{% else %}{{ user.physician_name }}{% endif %}" required>
                </div>
                <div>
                    <label class="font-mono text-xs font-bold uppercase tracking-wider text-ink/70 mb-1 block" for="id_consultation_date">Consultation Date *</label>
                    <input type="date" name="consultation_date" id="id_consultation_date" class="w-full bg-paper border-2 border-ink py-2 px-3 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-accent transition-all" value="{{ case.preliminary.consultation_date|date:'Y-m-d' }}" required>
                </div>
                <div>
                    <label class="font-mono text-xs font-bold uppercase tracking-wider text-ink/70 mb-1 block" for="id_consultation_time">Consultation Time</label>
                    <input type="time" name="consultation_time" id="id_consultation_time" class="w-full bg-paper border-2 border-ink py-2 px-3 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-accent transition-all" value="{{ case.preliminary.consultation_time|time:'H:i' }}">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div>
                    <label class="font-mono text-xs font-bold uppercase tracking-wider text-ink/70 mb-1 block" for="id_patient_name">Patient Name *</label>
                    <input type="text" name="patient_name" id="id_patient_name" class="w-full bg-paper border-2 border-ink py-2 px-3 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-accent transition-all" value="{{ case.preliminary.patient_name }}" required>
                </div>
                <div>
                    <label class="font-mono text-xs font-bold uppercase tracking-wider text-ink/70 mb-1 block" for="id_age">Age</label>
                    <input type="number" name="age" id="id_age" class="w-full bg-paper border-2 border-ink py-2 px-3 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-accent transition-all" value="{{ case.preliminary.age }}">
                </div>
                <div>
                    <label class="font-mono text-xs font-bold uppercase tracking-wider text-ink/70 mb-1 block" for="id_sex">Sex</label>
                    <select name="sex" id="id_sex" class="w-full bg-paper border-2 border-ink py-2 px-3 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-accent transition-all">
                        <option value="">Select</option>
                        <option value="M" {% if case.preliminary.sex == 'M' %}selected{% endif %}>Male</option>
                        <option value="F" {% if case.preliminary.sex == 'F' %}selected{% endif %}>Female</option>
                        <option value="O" {% if case.preliminary.sex == 'O' %}selected{% endif %}>Other</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="font-mono text-xs font-bold uppercase tracking-wider text-ink/70 mb-1 block" for="id_address">Address</label>
                <textarea name="address" id="id_address" class="w-full bg-paper border-2 border-ink py-2 px-3 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-accent transition-all" rows="2">{{ case.preliminary.address }}</textarea>
            </div>
        </div>
    </div>

    <!-- Section 4: Case History -->
    <div class="bg-paper border-2 border-ink p-6">
        <div class="flex items-center justify-between border-b-2 border-ink pb-3 mb-6">
            <h2 class="font-serif text-2xl font-bold">4. Case History</h2>
        </div>
        <div class="space-y-4">
            <div>
                <label class="font-mono text-xs font-bold uppercase tracking-wider text-ink/70 mb-1 block" for="id_hpi">History of Present Illness</label>
                <textarea name="hpi" id="id_hpi" class="w-full bg-paper border-2 border-ink py-2 px-3 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-accent transition-all" rows="3">{{ case.history.hpi }}</textarea>
            </div>
            <div>
                <label class="font-mono text-xs font-bold uppercase tracking-wider text-ink/70 mb-1 block" for="id_past_medical_history">Past Medical History</label>
                <textarea name="past_medical_history" id="id_past_medical_history" class="w-full bg-paper border-2 border-ink py-2 px-3 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-accent transition-all" rows="3">{{ case.history.past_medical_history }}</textarea>
            </div>
            <div>
                <label class="font-mono text-xs font-bold uppercase tracking-wider text-ink/70 mb-1 block" for="id_family_history">Family History</label>
                <textarea name="family_history" id="id_family_history" class="w-full bg-paper border-2 border-ink py-2 px-3 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-accent transition-all" rows="3">{{ case.history.family_history }}</textarea>
            </div>
        </div>
    </div>

    <!-- ... other sections would follow the same pattern ... -->

    <!-- Form Actions -->
    <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 pt-6 mt-6 border-t-2 border-ink">
        <div>
            {% if case.case_id %}
            <a href="{% url 'case_paper_delete' case.case_id %}" onclick="return confirm('Are you sure you want to delete this case paper? This action cannot be undone.');" class="w-full md:w-auto px-6 py-3 border-2 border-red-700 bg-red-700 text-paper font-mono text-xs uppercase font-bold flex items-center justify-center gap-2 hover:bg-red-800 transition-all">
                Delete
            </a>
            {% endif %}
        </div>
        <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
            <input type="hidden" id="formAction" name="action" value="save_draft">
            <button type="submit" onclick="document.getElementById('formAction').value='save_draft';" class="w-full md:w-auto px-6 py-3 border-2 border-ink bg-paper font-mono text-xs uppercase font-bold flex items-center justify-center gap-2 hover:bg-ink hover:text-paper transition-all">
                Save Draft
            </button>
            <button type="submit" onclick="document.getElementById('formAction').value='mark_complete';" class="w-full md:w-auto px-6 py-3 border-2 border-accent bg-accent text-paper font-mono text-xs uppercase font-bold flex items-center justify-center gap-2 hover:bg-accent/90 transition-all">
                Mark as Complete
            </button>
        </div>
    </div>
</form>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const consultationDateInput = document.getElementById('id_consultation_date');
    const consultationTimeInput = document.getElementById('id_consultation_time');

    // Set today's date if creating a new record and date is empty
    if (consultationDateInput && !consultationDateInput.value) {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        consultationDateInput.value = `${year}-${month}-${day}`;
    }

    // Set current time if creating a new record and time is empty
    if (consultationTimeInput && !consultationTimeInput.value) {
        const today = new Date();
        const hours = String(today.getHours()).padStart(2, '0');
        const minutes = String(today.getMinutes()).padStart(2, '0');
        consultationTimeInput.value = `${hours}:${minutes}`;
    }
});
</script>
{% endblock %}
