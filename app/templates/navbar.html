{% load static %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap');

    .top-navbar-pill {
        background: #FFFFFF;
        border-radius: 9999px;
        padding: 0.65rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.035);
        margin-bottom: 2.25rem;
        font-family: 'Inter', -apple-system, sans-serif;
    }

    .top-navbar-pill .nav-brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        text-decoration: none;
        color: #131313;
        font-family: 'Outfit', sans-serif;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.03em;
    }

    .top-navbar-pill .nav-links {
        display: flex;
        align-items: center;
        gap: 2.25rem;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .top-navbar-pill .nav-links a {
        text-decoration: none;
        color: #6B6965;
        font-size: 0.92rem;
        font-weight: 500;
        transition: color 0.15s ease;
    }

    .top-navbar-pill .nav-links a:hover,
    .top-navbar-pill .nav-links a.active {
        color: #131313;
        font-weight: 600;
    }

    .top-navbar-pill .nav-right {
        display: flex;
        align-items: center;
        gap: 0.85rem;
    }

    .top-navbar-pill .seg-toggle {
        background: #EAE8E3;
        border-radius: 9999px;
        padding: 0.25rem;
        display: flex;
        align-items: center;
        gap: 0.25rem;
    }

    .top-navbar-pill .seg-btn {
        padding: 0.45rem 1.15rem;
        border-radius: 9999px;
        font-size: 0.84rem;
        font-weight: 600;
        text-decoration: none;
        color: #6B6965;
        transition: all 0.2s ease;
    }

    .top-navbar-pill .seg-btn.active {
        background: #000000;
        color: #FFFFFF;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .top-navbar-pill .notif-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #000000;
        color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        font-size: 0.95rem;
        transition: transform 0.15s ease;
    }

    .top-navbar-pill .notif-btn:hover {
        transform: scale(1.05);
    }

    @media (max-width: 768px) {
        .top-navbar-pill {
            flex-direction: column;
            gap: 1rem;
        }
        .top-navbar-pill .nav-links {
            display: none;
        }
        .top-navbar-pill .nav-right {
            width: 100%;
            justify-content: space-between;
        }
    }
</style>

<nav class="top-navbar-pill">
    <a href="{% url 'home' %}" class="nav-brand">
        <i class="fas fa-wave-square"></i>
        <span>HomeoCompare</span>
    </a>

    <ul class="nav-links">
        <li><a href="{% url 'boericke_comparison' %}">Boericke Comparator</a></li>
        <li><a href="{% url 'allen_comparison' %}">Allen's Keynotes</a></li>
        <li><a href="{% url 'relationships' %}">Remedy Relationships</a></li>
        <li><a href="{% url 'durations' %}">Durations</a></li>
        <li><a href="{% url 'remedy_history' %}">Archive</a></li>
    </ul>

    <div class="nav-right">
        <div class="seg-toggle">
            <a href="{% url 'boericke_comparison' %}" class="seg-btn active">Materia</a>
            <a href="{% url 'clinic_dashboard' %}" class="seg-btn">Clinic</a>
        </div>
        <a href="{% url 'saved_remedies' %}" class="notif-btn" title="Saved Remedies">
            <i class="fas fa-bookmark"></i>
        </a>
    </div>
</nav>
